<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Member Portal{% endblock %}</title>
    {% load static %}

    <!-- Core CSS (shared with admin) -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/page-layout.css' %}">

    <!-- Member-specific CSS -->
    <link rel="stylesheet" href="{% static 'css/pages/member.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="app-layout member-portal">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" role="navigation" aria-label="Main Navigation">
            <div class="sidebar-brand">
                <h1>Member Portal</h1>
            </div>

            <div class="sidebar-menu">
                <a href="{% url 'member_portal:dashboard' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    Dashboard
                </a>
                <a href="{% url 'member_portal:accounts' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'accounts' or request.resolver_match.url_name == 'account_detail' %}active{% endif %}">
                    My Accounts
                </a>
                <a href="{% url 'member_portal:loans' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'loans' or request.resolver_match.url_name == 'loan_detail' %}active{% endif %}">
                    My Loans
                </a>
                <a href="{% url 'member_portal:transactions' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'transactions' %}active{% endif %}">
                    Transactions
                </a>
            </div>

            <div class="sidebar-footer">
                <a href="{% url 'member_portal:profile' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
                    Profile
                </a>
                <form method="post" action="{% url 'logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="sidebar-link logout-button">
                        Logout
                    </button>
                </form>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content" role="main">
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message message-{{ message.tags }}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{% static 'js/utils.js' %}"></script>
    <script src="{% static 'js/member.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
