{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <style>
        body {
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .err {
            text-align: center;
            max-width: 400px;
            padding: 40px;
        }

        .err-code {
            font-size: 72px;
            font-weight: 800;
            color: #111;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .err-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .err-text {
            font-size: 13px;
            color: #737373;
            margin-bottom: 24px;
        }

        .err-link {
            display: inline-block;
            padding: 8px 20px;
            background: #111;
            color: #fff;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }

        .err-link:hover {
            background: #333;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="err">
        <div class="err-code">404</div>
        <div class="err-title">Page not found</div>
        <p class="err-text">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="err-link">Go Home</a>
    </div>
</body>

</html>
