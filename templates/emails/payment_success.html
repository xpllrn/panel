<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Payment Successful - {{ society_name }}</title>
</head>
<body>
    <h2>Payment Successful</h2>
    <p>Hello {{ user.display_name }},</p>
    <p>Your payment has been successfully received.</p>
    <ul>
        <li>Type: {{ payment_type }}</li>
        <li>Amount: ₹{{ amount }}</li>
        <li>Reference: {{ reference }}</li>
    </ul>
    <p>Thank you for banking with {{ society_name }}.</p>
</body>
</html>
