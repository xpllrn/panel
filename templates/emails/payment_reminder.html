<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Payment Reminder - {{ society_name }}</title>
</head>
<body>
    <h2>Payment Reminder</h2>
    <p>Hello {{ user.display_name }},</p>
    <p>This is a reminder for your upcoming payment.</p>
    <ul>
        <li>Type: {{ payment_type }}</li>
        <li>Due Amount: ₹{{ due_amount }}</li>
        <li>Due Date: {{ due_date }}</li>
    </ul>
    <p>Please make the payment on or before the due date.</p>
</body>
</html>
