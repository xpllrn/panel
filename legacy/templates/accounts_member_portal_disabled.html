<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Portal Disabled</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body style="background:#f5f7fb; font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;">
    <div style="max-width:560px; margin:7rem auto; background:#fff; border-radius:12px; padding:2rem; box-shadow:0 8px 24px rgba(0,0,0,0.08);">
        <h2 style="margin:0 0 0.75rem;">Member Portal Temporarily Disabled</h2>
        <p style="margin:0 0 1.2rem; color:#4b5563;">
            Member web portal access is currently disabled. Mobile app APIs are still active.
            Please contact an admin for support.
        </p>
        {% if WEB_LOGIN_DISABLED %}
        <p style="margin:0;">
            <a href="/home/" style="display:inline-block; background:#2563eb; color:#fff; text-decoration:none; padding:0.65rem 1rem; border-radius:8px;">
                Admin dashboard
            </a>
        </p>
        {% else %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" style="background:#2563eb; color:#fff; border:none; padding:0.65rem 1rem; border-radius:8px; cursor:pointer;">
                Logout
            </button>
        </form>
        {% endif %}
    </div>
</body>
</html>
